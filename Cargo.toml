[package]
name = "ren-find"
version = "0.0.3"
edition = "2021"
authors = ["Roben Kleene <contact@robenkleene.com>"]
description = "Rename files from find results."
readme = "README.md"
keywords = ["rename", "find", "replace", "regex", "grep"]
license = "MIT"
homepage = "https://github.com/robenkleene/ren-find"
repository = "https://github.com/robenkleene/ren-find.git"
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ren"
path = "src/main.rs"

[dependencies]
regex = "1.4.3"
clap = { version = "4", features = ["derive"] }
unescape = "0.1.0"
tempfile = "3.2.0"
thiserror = "2"
diffy-fork-filenames = "0.4.0"
indexmap = "2"
shell-words = "1.1.0"
grep-cli = "0.1.7"

[dev-dependencies]
assert_cmd = "2"
anyhow = "1.0.38"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
man = "0.3.0"

[profile.release]
opt-level = 3
lto = true
